version: 1
verity:
  project_id: 35c1f7c7-027b-4c70-95f1-497b1fcf8021
  callback_url: https://localhost:3001/api/callbacks/github-actions
  bootstrap_version: v2
  max_generated_stories: 500
commands:
  setup:
  - pnpm install --frozen-lockfile
  test: []
  build:
  - pnpm run build
  deploy: []
  test_groups:
    unit: []
    integration: []
    e2e: []
automation:
  test_auto_fix:
    enabled: true
    max_attempts: 3
    post_merge_validation: true
    pr_triggers:
    - opened
    - synchronize
    - reopened
  e2e:
    enabled: auto
    command: []
    start_command: ''
    base_url: ''
    base_url_env: PLAYWRIGHT_BASE_URL
    required_env: []
policies:
  pr_review:
    enabled: true
    label_required: verity:agent
  openai_guardrail:
    enabled: true
  documentation:
    auto_mode: true
    handoff_file: docs/AI_HANDOFF.md
