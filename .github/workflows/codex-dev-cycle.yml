name: Verity Codex Dev Cycle

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number (optional)"
        required: false
        default: ""
      user_request:
        description: "What to implement/fix (optional)"
        required: false
        default: ""
      callback_url:
        description: "Verity callback URL override (optional)"
        required: false
        default: ""
      verity_project_id:
        description: "Verity project id override (optional)"
        required: false
        default: ""
      pr_title:
        description: "PR title override (optional)"
        required: false
        default: ""
      pr_labels:
        description: "Comma-separated labels"
        required: false
        default: "verity:agent,verity:codex"
      pr_draft:
        description: "Create PR as draft (true/false)"
        required: false
        default: "false"
      allow_docs_only_pr:
        description: "Allow PRs with docs-only changes (true/false)"
        required: false
        default: "false"
      auto_merge:
        description: "Auto-merge the PR once all required checks pass (true/false)"
        required: false
        default: "false"
      tenant_path:
        description: "Tenant directory path scope (optional)"
        required: false
        default: ""
      allowed_write_globs:
        description: "Comma-separated allowed write globs (optional)"
        required: false
        default: ""
      target_repository:
        description: "Target repository hint for tenant-scoped jobs"
        required: false
        default: ""
      scope_policy_mode:
        description: "Tenant isolation policy mode (none/suggest/enforce)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: verity-dev-cycle-${{ github.repository }}-${{ inputs.issue_number != '' && inputs.issue_number || github.ref_name }}
  cancel-in-progress: false

jobs:
  dev_cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout (default branch)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "Missing required secret OPENAI_API_KEY" >&2
            exit 1
          fi
          if [ -z "${{ secrets.VERITY_PROJECT_TOKEN }}" ]; then
            echo "Missing required secret VERITY_PROJECT_TOKEN" >&2
            exit 1
          fi

      - name: Detect GitHub App write-token config
        id: gh_write_cfg
        env:
          VERITY_GITHUB_APP_ID: ${{ secrets.VERITY_GITHUB_APP_ID }}
          VERITY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.VERITY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$VERITY_GITHUB_APP_ID" ] && [ -n "$VERITY_GITHUB_APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve GitHub write token (optional GitHub App)
        id: gh_write_token
        if: ${{ steps.gh_write_cfg.outputs.enabled == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.VERITY_GITHUB_APP_ID }}
          private-key: ${{ secrets.VERITY_GITHUB_APP_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install YAML parser
        run: python -m pip install --upgrade pip pyyaml

      - name: Load .verity/config.yml
        id: cfg
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          cfg_path = Path(".verity/config.yml")
          if not cfg_path.exists():
            raise SystemExit("Missing .verity/config.yml (bootstrap incomplete)")

          cfg = yaml.safe_load(cfg_path.read_text()) or {}
          verity = cfg.get("verity", {}) or {}
          commands = cfg.get("commands", {}) or {}
          policies = cfg.get("policies", {}) or {}
          callback_override = os.environ.get("VERITY_CALLBACK_OVERRIDE", "").strip()
          project_override = os.environ.get("VERITY_PROJECT_OVERRIDE", "").strip()

          def norm_list(v):
            if v is None: return []
            if isinstance(v, list): return [str(x) for x in v if str(x).strip()]
            if isinstance(v, str) and v.strip(): return [v.strip()]
            return []

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
            f.write(f"project_id={project_override or str(verity.get('project_id','')).strip()}\n")
            f.write(f"callback_url={callback_override or str(verity.get('callback_url','')).strip()}\n")
            f.write("setup_cmds<<EOF\n" + "\n".join(norm_list(commands.get("setup"))) + "\nEOF\n")
            f.write("test_cmds<<EOF\n" + "\n".join(norm_list(commands.get("test"))) + "\nEOF\n")
            f.write("build_cmds<<EOF\n" + "\n".join(norm_list(commands.get("build"))) + "\nEOF\n")
            f.write(f"pr_review_enabled={bool((policies.get('pr_review', {}) or {}).get('enabled', True))}\n")
            f.write(f"pr_review_label={str((policies.get('pr_review', {}) or {}).get('label_required','verity:agent')).strip()}\n")
            docs_auto_mode = bool((policies.get('documentation', {}) or {}).get('auto_mode', False))
            f.write(f"docs_auto_mode={'true' if docs_auto_mode else 'false'}\n")
          PY
        env:
          VERITY_CALLBACK_OVERRIDE: ${{ inputs.callback_url }}
          VERITY_PROJECT_OVERRIDE: ${{ inputs.verity_project_id }}

      - name: Detect default monorepo Playwright layout
        id: layout
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ] && [ -d backend ] && [ -f backend/package.json ]; then
            echo "monorepo_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "monorepo_e2e=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/ + backend/ with package.json — skipping Verity Playwright e2e (monorepo layout only)."
          fi

      - name: Run setup commands
        if: ${{ steps.cfg.outputs.setup_cmds != '' }}
        run: |
          set -euo pipefail
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::setup: $cmd"
            bash -lc "$cmd"
            echo "::endgroup::"
          done <<< "${{ steps.cfg.outputs.setup_cmds }}"

      - name: Notify Verity - started
        continue-on-error: true
        env:
          VERITY_PROJECT_TOKEN: ${{ secrets.VERITY_PROJECT_TOKEN }}
          VERITY_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          VERITY_CALLBACK_URL: ${{ steps.cfg.outputs.callback_url }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > /tmp/verity-callback.json
          import json, os
          payload = {
            "event": "workflow_started",
            "project_id": os.environ.get("VERITY_PROJECT_ID"),
            "repo": os.environ.get("GITHUB_REPOSITORY"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
            "issue_number": os.environ.get("ISSUE_NUMBER") or None,
            "branch": os.environ.get("BRANCH_NAME") or None,
            "sha": os.environ.get("HEAD_SHA") or None,
            "run_correlation_id": f"{os.environ.get('GITHUB_WORKFLOW')}:{os.environ.get('GITHUB_RUN_ID')}:{os.environ.get('GITHUB_RUN_ATTEMPT')}"
          }
          print(json.dumps(payload))
          PY
          curl -sS -X POST "$VERITY_CALLBACK_URL" \
            -H "Authorization: Bearer $VERITY_PROJECT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verity-callback.json || true

      - name: Fetch issue context (optional)
        if: ${{ inputs.issue_number != '' && inputs.issue_number != '0' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.gh_write_token.outputs.token || secrets.VERITY_GITHUB_WRITE_TOKEN || github.token }}
          script: |
            const fs = require("fs");
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const sanitize = (s) => (s || "").replace(/<!--[\s\S]*?-->/g, "").slice(0, 20000);
            fs.writeFileSync("issue_context.md", [
              `# Issue #${issue_number}: ${issue.title}`,
              "",
              sanitize(issue.body),
              "",
            ].join("\n"));
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}

      - name: Render Codex prompt (append runtime inputs)
        env:
          USER_REQUEST: ${{ inputs.user_request }}
          TENANT_PATH: ${{ inputs.tenant_path }}
          ALLOWED_WRITE_GLOBS: ${{ inputs.allowed_write_globs }}
          SCOPE_POLICY_MODE: ${{ inputs.scope_policy_mode }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set -euo pipefail
          cat .github/codex/prompts/dev-cycle.md > codex-prompt.md
          echo "" >> codex-prompt.md
          echo "## Runtime inputs" >> codex-prompt.md
          echo "" >> codex-prompt.md
          echo "- Repo: ${GITHUB_REPOSITORY}" >> codex-prompt.md
          echo "- Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> codex-prompt.md
          echo "- Verity Project ID: ${{ steps.cfg.outputs.project_id }}" >> codex-prompt.md
          if [ -n "${TARGET_REPOSITORY:-}" ]; then
            echo "- Target repository: ${TARGET_REPOSITORY}" >> codex-prompt.md
          fi
          if [ -n "${TENANT_PATH:-}" ]; then
            echo "- Tenant path scope: ${TENANT_PATH}" >> codex-prompt.md
          fi
          if [ -n "${ALLOWED_WRITE_GLOBS:-}" ]; then
            echo "- Allowed write globs: ${ALLOWED_WRITE_GLOBS}" >> codex-prompt.md
          fi
          if [ -n "${SCOPE_POLICY_MODE:-}" ]; then
            echo "- Scope policy mode: ${SCOPE_POLICY_MODE}" >> codex-prompt.md
          fi
          if [ -n "${USER_REQUEST:-}" ]; then
            echo "" >> codex-prompt.md
            echo "## User request" >> codex-prompt.md
            echo "" >> codex-prompt.md
            printf '%s\n' "$USER_REQUEST" >> codex-prompt.md
          fi
          if [ -f issue_context.md ]; then
            echo "" >> codex-prompt.md
            echo "## Issue context" >> codex-prompt.md
            echo "" >> codex-prompt.md
            cat issue_context.md >> codex-prompt.md
          fi

      - name: Install Playwright browsers (before Codex drops sudo)
        continue-on-error: true
        id: pw_install
        if: ${{ steps.layout.outputs.monorepo_e2e == 'true' }}
        run: |
          sudo npx playwright install-deps chromium
          cd frontend && npx playwright install chromium

      - name: Run Codex (workspace edits allowed)
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.VERITY_CODEX_MODEL != '' && vars.VERITY_CODEX_MODEL || 'gpt-5' }}
          prompt-file: codex-prompt.md
          output-file: codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: ${{ vars.VERITY_CODEX_ALLOW_BOT_USERS }}
          codex-args: '["--full-auto"]'

      - name: Sync docs context (auto document mode)
        if: ${{ steps.cfg.outputs.docs_auto_mode == 'true' }}
        run: python scripts/sync_repo_docs.py

      - name: Run tests pass 1 (capture errors for potential Codex fix)
        id: test_pass1
        if: ${{ steps.cfg.outputs.test_cmds != '' }}
        continue-on-error: true
        run: |
          rm -f test-error.txt
          test_failed=false
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::test: $cmd"
            set +e
            bash -lc "$cmd" 2>&1 | tee -a test-error.txt
            cmd_exit=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$cmd_exit" -ne 0 ]; then
              test_failed=true
              break
            fi
          done <<< "${{ steps.cfg.outputs.test_cmds }}"
          echo "test_failed=${test_failed}" >> "$GITHUB_OUTPUT"
          if [ "$test_failed" = "true" ]; then
            exit 1
          fi

      - name: Prepare Codex test-fix prompt
        if: ${{ steps.test_pass1.outputs.test_failed == 'true' }}
        run: |
          set -euo pipefail
          {
            echo "## Codex Unit Test Fix Pass"
            echo ""
            echo "Unit tests failed. Fix ONLY the source files causing the errors below."
            echo ""
            echo "### Required process for EACH failing file:"
            echo "1. **Read the full current content** of the file first — do not rewrite from memory."
            echo "2. Apply a **minimal, surgical fix** — change only the lines causing the error."
            echo "3. Write the fixed file using Python pathlib."
            echo "4. Fix the **source code** unless the test itself has a bug (test references a renamed function, deleted feature, etc.)."
            echo ""
            echo "### Rules:"
            echo "- Read the file BEFORE writing. Never overwrite with stale or partial content."
            echo "- Preserve ALL existing code — only change what the error requires."
            echo "- Do NOT add new features or refactor unrelated code."
            echo ""
            echo "## Test error output"
            echo ""
            echo '```'
            cat test-error.txt
            echo '```'
          } > codex-test-fix-prompt.md

      - name: Run Codex test fix
        id: codex_test_fix
        if: ${{ steps.test_pass1.outputs.test_failed == 'true' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.VERITY_CODEX_MODEL != '' && vars.VERITY_CODEX_MODEL || 'gpt-5' }}
          prompt-file: codex-test-fix-prompt.md
          output-file: codex-test-fix-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: ${{ vars.VERITY_CODEX_ALLOW_BOT_USERS }}
          codex-args: '["--full-auto"]'

      - name: Run tests pass 2 (final)
        if: ${{ steps.test_pass1.outputs.test_failed == 'true' }}
        run: |
          set -euo pipefail
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::test pass 2: $cmd"
            bash -lc "$cmd"
            echo "::endgroup::"
          done <<< "${{ steps.cfg.outputs.test_cmds }}"

      - name: Install dependencies (for any modified package.json)
        if: ${{ steps.cfg.outputs.build_cmds != '' }}
        run: |
          set -euo pipefail
          # Find ALL package.json files modified by Codex — any directory, any repo structure
          modified=$(git diff --name-only HEAD | grep -E '(^|/)package\.json$' || true)
          install_dirs=""
          if [ -n "$modified" ]; then
            while IFS= read -r f; do
              d=$(dirname "$f")
              echo "package.json changed in $d — running npm install"
              (cd "$d" && npm install)
              install_dirs="$install_dirs:$d:"
            done <<< "$modified"
          fi
          # For every other JS project dir that has a lockfile, run npm ci to ensure deps are current
          while IFS= read -r lockfile; do
            d=$(dirname "$lockfile")
            if [[ ":$install_dirs:" != *":$d:"* ]]; then
              echo "Running npm ci in $d"
              (cd "$d" && npm ci) || true
            fi
          done < <(find . -name 'package-lock.json' -not -path '*/node_modules/*')

      - name: Run build pass 1 (capture errors for potential Codex fix)
        id: build_pass1
        if: ${{ steps.cfg.outputs.build_cmds != '' }}
        continue-on-error: true
        run: |
          rm -f build-error.txt
          build_failed=false
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::build: $cmd"
            set +e
            bash -lc "$cmd" 2>&1 | tee -a build-error.txt
            cmd_exit=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$cmd_exit" -ne 0 ]; then
              build_failed=true
              break
            fi
          done <<< "${{ steps.cfg.outputs.build_cmds }}"
          echo "build_failed=${build_failed}" >> "$GITHUB_OUTPUT"
          if [ "$build_failed" = "true" ]; then
            exit 1
          fi

      - name: Prepare Codex build-fix prompt
        if: ${{ steps.build_pass1.outputs.build_failed == 'true' }}
        run: |
          set -euo pipefail
          {
            echo "## Codex Build Fix Pass"
            echo ""
            echo "The previous build failed. Fix ONLY the source files causing the errors below."
            echo ""
            echo "### Required process for EACH failing file:"
            echo "1. **Read the full current content** of the file first — do not rewrite from memory."
            echo "2. Apply a **minimal, surgical fix** — change only the lines causing the error."
            echo "3. Write the fixed file using Python:"
            echo '   ```python'
            echo "   from pathlib import Path"
            echo '   Path("path/to/file").write_text("""<full corrected content>""", encoding="utf-8")'
            echo '   ```'
            echo "4. Verify the file was written and has substantial content:"
            echo '   ```python'
            echo '   p = Path("path/to/file")'
            echo '   assert p.stat().st_size > 50, f"Write failed: {p}"'
            echo '   ```'
            echo ""
            echo "### Rules:"
            echo "- Read the file BEFORE writing. Never overwrite with stale or partial content."
            echo "- Preserve ALL existing code — only change what the error requires."
            echo "- Do NOT add new features or refactor unrelated code."
            echo "- If the error mentions a missing import or component, check if the file exists before creating it."
            echo ""
            echo "## Build error output"
            echo ""
            echo '```'
            cat build-error.txt
            echo '```'
          } > codex-fix-prompt.md

      - name: Run Codex pass 2 (fix build errors)
        id: codex_fix
        if: ${{ steps.build_pass1.outputs.build_failed == 'true' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.VERITY_CODEX_MODEL != '' && vars.VERITY_CODEX_MODEL || 'gpt-5' }}
          prompt-file: codex-fix-prompt.md
          output-file: codex-fix-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: ${{ vars.VERITY_CODEX_ALLOW_BOT_USERS }}
          codex-args: '["--full-auto"]'

      - name: Re-install dependencies after Codex build fix
        if: ${{ steps.build_pass1.outputs.build_failed == 'true' }}
        run: |
          set -euo pipefail
          modified=$(git diff --name-only HEAD | grep -E '(^|/)package\.json$' || true)
          install_dirs=""
          if [ -n "$modified" ]; then
            while IFS= read -r f; do
              d=$(dirname "$f")
              echo "package.json changed in $d — running npm install"
              (cd "$d" && npm install)
              install_dirs="$install_dirs:$d:"
            done <<< "$modified"
          fi
          while IFS= read -r lockfile; do
            d=$(dirname "$lockfile")
            if [[ ":$install_dirs:" != *":$d:"* ]]; then
              echo "Running npm ci in $d"
              (cd "$d" && npm ci) || true
            fi
          done < <(find . -name 'package-lock.json' -not -path '*/node_modules/*')

      - name: Run build pass 2 (final)
        if: ${{ steps.build_pass1.outputs.build_failed == 'true' }}
        run: |
          set -euo pipefail
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::build pass 2: $cmd"
            bash -lc "$cmd"
            echo "::endgroup::"
          done <<< "${{ steps.cfg.outputs.build_cmds }}"

      # ─── LAYER 1: BROWSER TESTING (e2e) ───
      # Runs Playwright tests against locally running servers BEFORE the PR is
      # created.  The same Codex instance that wrote the feature code can fix
      # browser-test failures with full context (up to 3 attempts).
      # If servers fail to start the e2e gate is skipped — not blocked.

      - name: Start local servers for browser testing
        id: e2e_servers
        if: ${{ steps.pw_install.outcome == 'success' }}
        continue-on-error: true
        run: |
          # Start backend in local mode (no AWS credentials needed)
          cd backend && LOCAL_MODE=true npm run dev > /tmp/backend.log 2>&1 &
          # Start frontend dev server (auto-detects localhost:3001 as API in dev mode)
          cd frontend && npx vite --host > /tmp/frontend.log 2>&1 &
          # Wait for backend health check (up to 60s)
          echo "Waiting for backend (localhost:3001)..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health > /dev/null 2>&1 && echo "Backend ready." && break
            sleep 1
          done
          # Wait for frontend (up to 60s)
          echo "Waiting for frontend (localhost:5173)..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 > /dev/null 2>&1 && echo "Frontend ready." && break
            sleep 1
          done
          # Final readiness check
          if ! curl -sf http://localhost:3001/health > /dev/null 2>&1; then
            echo "::warning::Backend failed to start — skipping e2e tests"
            echo "servers_ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! curl -sf http://localhost:5173 > /dev/null 2>&1; then
            echo "::warning::Frontend failed to start — skipping e2e tests"
            echo "servers_ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "servers_ready=true" >> "$GITHUB_OUTPUT"

      # --- Browser test pass 1 ---
      - name: Run browser tests (pass 1)
        id: e2e_pass1
        if: ${{ steps.e2e_servers.outputs.servers_ready == 'true' }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VERITY_E2E_EMAIL: ${{ secrets.VERITY_E2E_EMAIL }}
          VERITY_E2E_PASSWORD: ${{ secrets.VERITY_E2E_PASSWORD }}
          VERITY_API_BASE: http://localhost:3001
        run: |
          set +e
          cd frontend && npx playwright test 2>&1 | tee ../e2e-error.txt
          e2e_exit=${PIPESTATUS[0]}
          set -e
          if [ "$e2e_exit" -ne 0 ]; then
            echo "e2e_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "e2e_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Codex e2e fix prompt (attempt 1)
        if: ${{ steps.e2e_pass1.outputs.e2e_failed == 'true' }}
        run: |
          {
            echo "## Codex Browser Test Fix (Attempt 1 of 3)"
            echo ""
            echo "Playwright browser tests failed against the locally running app."
            echo "Backend: http://localhost:3001 | Frontend: http://localhost:5173"
            echo ""
            echo "### Required process:"
            echo "1. **Read the failing source file** BEFORE writing any fix."
            echo "2. Apply a **minimal, surgical fix** — change only what causes the failure."
            echo "3. Write files using Python pathlib (see dev-cycle prompt for the pattern)."
            echo "4. Fix the **source code** unless the test itself has a bug."
            echo "5. Do NOT add new features or refactor unrelated code."
            echo ""
            echo "## Playwright error output"
            echo '```'
            cat e2e-error.txt
            echo '```'
          } > codex-e2e-fix-prompt.md

      - name: Run Codex e2e fix (attempt 1)
        if: ${{ steps.e2e_pass1.outputs.e2e_failed == 'true' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.VERITY_CODEX_MODEL != '' && vars.VERITY_CODEX_MODEL || 'gpt-5' }}
          prompt-file: codex-e2e-fix-prompt.md
          output-file: codex-e2e-fix-output-1.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: ${{ vars.VERITY_CODEX_ALLOW_BOT_USERS }}
          codex-args: '["--full-auto"]'

      # --- Browser test pass 2 ---
      - name: Run browser tests (pass 2)
        id: e2e_pass2
        if: ${{ steps.e2e_pass1.outputs.e2e_failed == 'true' }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VERITY_E2E_EMAIL: ${{ secrets.VERITY_E2E_EMAIL }}
          VERITY_E2E_PASSWORD: ${{ secrets.VERITY_E2E_PASSWORD }}
          VERITY_API_BASE: http://localhost:3001
        run: |
          set +e
          cd frontend && npx playwright test 2>&1 | tee ../e2e-error.txt
          e2e_exit=${PIPESTATUS[0]}
          set -e
          if [ "$e2e_exit" -ne 0 ]; then
            echo "e2e_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "e2e_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Codex e2e fix prompt (attempt 2)
        if: ${{ steps.e2e_pass2.outputs.e2e_failed == 'true' }}
        run: |
          {
            echo "## Codex Browser Test Fix (Attempt 2 of 3)"
            echo ""
            echo "Playwright browser tests STILL failing after first fix attempt."
            echo "The issue may be DIFFERENT from the first failure."
            echo "Backend: http://localhost:3001 | Frontend: http://localhost:5173"
            echo ""
            echo "### Required process:"
            echo "1. **Read the failing source file** BEFORE writing any fix."
            echo "2. Apply a **minimal, surgical fix** — change only what causes the failure."
            echo "3. Write files using Python pathlib (see dev-cycle prompt for the pattern)."
            echo "4. Fix the **source code** unless the test itself has a bug."
            echo "5. Do NOT add new features or refactor unrelated code."
            echo ""
            echo "## Playwright error output"
            echo '```'
            cat e2e-error.txt
            echo '```'
          } > codex-e2e-fix-prompt.md

      - name: Run Codex e2e fix (attempt 2)
        if: ${{ steps.e2e_pass2.outputs.e2e_failed == 'true' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.VERITY_CODEX_MODEL != '' && vars.VERITY_CODEX_MODEL || 'gpt-5' }}
          prompt-file: codex-e2e-fix-prompt.md
          output-file: codex-e2e-fix-output-2.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: ${{ vars.VERITY_CODEX_ALLOW_BOT_USERS }}
          codex-args: '["--full-auto"]'

      # --- Browser test pass 3 (final) ---
      - name: Run browser tests (pass 3 - final)
        id: e2e_pass3
        if: ${{ steps.e2e_pass2.outputs.e2e_failed == 'true' }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VERITY_E2E_EMAIL: ${{ secrets.VERITY_E2E_EMAIL }}
          VERITY_E2E_PASSWORD: ${{ secrets.VERITY_E2E_PASSWORD }}
          VERITY_API_BASE: http://localhost:3001
        run: |
          set +e
          cd frontend && npx playwright test 2>&1 | tee ../e2e-error.txt
          e2e_exit=${PIPESTATUS[0]}
          set -e
          if [ "$e2e_exit" -ne 0 ]; then
            echo "e2e_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "e2e_failed=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Determine final e2e status ---
      - name: Resolve browser test outcome
        id: e2e_final
        if: always()
        run: |
          if [ "${{ steps.e2e_servers.outputs.servers_ready }}" != "true" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.e2e_pass1.outputs.e2e_failed }}" != "true" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.e2e_pass2.outputs.e2e_failed }}" != "true" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.e2e_pass3.outputs.e2e_failed }}" != "true" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop local servers
        if: always()
        run: |
          pkill -f "ts-node-dev" || true
          pkill -f "vite" || true

      # ─── END LAYER 1 ───

      # ─── Capture passing E2E specs for test case library ───
      - name: Collect passing E2E spec files
        id: e2e_specs
        if: ${{ steps.e2e_final.outputs.status == 'passed' }}
        run: |
          # Find all .spec.ts files under frontend/e2e/ that Codex created or modified
          specs_json="[]"
          if [ -d "frontend/e2e" ]; then
            specs_json=$(python3 - <<'PY'
          import json, os, glob
          specs = []
          for path in sorted(glob.glob("frontend/e2e/**/*.spec.ts", recursive=True)):
            try:
              content = open(path, encoding="utf-8").read()
              if len(content.strip()) > 50:  # skip near-empty files
                specs.append({"path": path, "content": content[:50000]})  # cap per file
            except Exception:
              pass
          print(json.dumps(specs))
          PY
            )
          fi
          # Save to a file for the callback step to read
          echo "$specs_json" > /tmp/e2e-spec-files.json
          count=$(echo "$specs_json" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Collected $count E2E spec file(s) for test case capture"

      - name: Upload artifacts (before cleanup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verity-codex-dev-cycle
          path: |
            codex-prompt.md
            codex-output.md
            codex-fix-prompt.md
            codex-fix-output.md
            codex-conflict-prompt.md
            codex-conflict-output.md
            codex-test-fix-prompt.md
            codex-test-fix-output.md
            codex-e2e-fix-prompt.md
            codex-e2e-fix-output-1.md
            codex-e2e-fix-output-2.md
            build-error.txt
            test-error.txt
            e2e-error.txt
            issue_context.md
          if-no-files-found: ignore

      - name: Clean generated artifacts before PR
        run: |
          set -euo pipefail

          # Remove common local artifacts created during Codex/test/build execution.
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f codex-prompt.md codex-output.md codex-fix-prompt.md codex-fix-output.md \
                codex-conflict-prompt.md codex-conflict-output.md build-error.txt \
                codex-test-fix-prompt.md codex-test-fix-output.md \
                codex-e2e-fix-prompt.md codex-e2e-fix-output-1.md codex-e2e-fix-output-2.md \
                test-error.txt e2e-error.txt issue_context.md pr-body.md
          rm -rf frontend/node_modules/.vite frontend/node_modules/.vite-* frontend/.vite

          # If these paths are tracked in this repo, restore them to avoid noisy PR diffs.
          while IFS= read -r path; do
            git restore --source=HEAD --staged --worktree -- "$path" || true
          done < <(
            git diff --name-only | grep -E '^(codex-prompt\.md|codex-output\.md|codex-fix-prompt\.md|codex-fix-output\.md|codex-conflict-prompt\.md|codex-conflict-output\.md|build-error\.txt|issue_context\.md|pr-body\.md|__pycache__/|.*\.pyc$|frontend/node_modules/\.vite($|/)|frontend/node_modules/\.vite-[^/]+/)'
          )

          # Restore auto-generated docs so they don't interfere with the docs-only guard.
          # sync_repo_docs.py always rewrites these with the current commit SHA/timestamp;
          # without this restore, runs where Codex produced no code changes would be blocked
          # by the guard (docs-only detected → exit 1) even though no real fix was attempted.
          git restore --source=HEAD --staged --worktree -- docs/REPO_CONTEXT.md docs/AI_HANDOFF.md 2>/dev/null || true

      - name: Sync with latest base branch (prevent stale PR base)
        id: sync_base
        run: |
          set -euo pipefail
          # Get the default branch name (more reliable than GITHUB_REF_NAME for workflow_dispatch)
          base=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@' || echo "${GITHUB_REF_NAME}")
          git fetch origin "${base}" --quiet
          new_commits=$(git rev-list --count HEAD..origin/${base} 2>/dev/null || echo "0")
          if [ "$new_commits" = "0" ]; then
            echo "Base branch is up to date."
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Base branch has $new_commits new commit(s) since checkout — syncing."
          # Stage all Codex working-tree changes before stashing (includes new/untracked files)
          git add -A
          stash_label="verity-codex-wip"
          git stash push -m "$stash_label" 2>&1 || true
          stashed=$(git stash list | grep -c "$stash_label" || echo "0")
          # Fast-forward HEAD to latest base
          git reset --hard "origin/${base}"
          # Re-apply Codex changes on top of the updated base
          if [ "$stashed" != "0" ]; then
            if git stash pop 2>&1; then
              echo "Stash applied cleanly — no conflicts."
              echo "conflicts=false" >> "$GITHUB_OUTPUT"
            else
              echo "Conflicts detected when applying Codex changes onto updated base."
              conflict_files=$(git diff --name-only --diff-filter=U || true)
              echo "conflicts=true" >> "$GITHUB_OUTPUT"
              printf 'conflict_files<<EOF\n%s\nEOF\n' "$conflict_files" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No working-tree changes to restore."
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Codex conflict-resolution prompt
        if: ${{ steps.sync_base.outputs.conflicts == 'true' }}
        env:
          CONFLICT_FILES: ${{ steps.sync_base.outputs.conflict_files }}
        run: |
          set -euo pipefail
          {
            echo "## Codex Conflict Resolution Pass"
            echo ""
            echo "Your previous changes conflicted with the latest base branch after syncing."
            echo "The following files have conflict markers (\`<<<<<<<\`, \`=======\`, \`>>>>>>>\`):"
            echo ""
            printf '%s\n' "${CONFLICT_FILES}" | while IFS= read -r f; do
              [ -n "$f" ] && echo "- $f"
            done
            echo ""
            echo "For each conflicted file:"
            echo "1. Read the file to see the conflict markers."
            echo "2. Resolve by keeping BOTH the base changes AND your original intent."
            echo "3. Write the resolved file using Python pathlib.Path.write_text() — no conflict markers in the final output."
            echo "4. Verify the file has no remaining \`<<<<<<<\` markers."
            echo ""
            echo "Do NOT commit. Leave resolved files in the working tree."
          } > codex-conflict-prompt.md

      - name: Run Codex pass 3 (resolve conflicts)
        id: codex_conflict
        if: ${{ steps.sync_base.outputs.conflicts == 'true' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.VERITY_CODEX_MODEL != '' && vars.VERITY_CODEX_MODEL || 'gpt-5' }}
          prompt-file: codex-conflict-prompt.md
          output-file: codex-conflict-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write
          allow-bots: true
          allow-bot-users: ${{ vars.VERITY_CODEX_ALLOW_BOT_USERS }}
          codex-args: '["--full-auto"]'

      - name: Guard against docs-only PRs
        env:
          ALLOW_DOCS_ONLY_PR: ${{ inputs.allow_docs_only_pr }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only HEAD || true)"
          if [ -z "$changed_files" ]; then
            echo "No changes detected; skipping docs-only guard."
            exit 0
          fi

          non_docs="$(
            printf '%s\n' "$changed_files" | grep -Ev '(^docs/|^README\.md$|^CHANGELOG\.md$|^LICENSE$|^AGENTS\.md$|^\.github/codex/prompts/|^\.github/codex/schemas/|\.md$)' || true
          )"

          if [ -n "$non_docs" ]; then
            echo "Non-doc changes detected; continuing."
            exit 0
          fi

          if [ "${ALLOW_DOCS_ONLY_PR}" = "true" ]; then
            echo "Only docs changed, but allow_docs_only_pr=true so continuing."
            exit 0
          fi

          echo "Docs-only change set detected. Set allow_docs_only_pr=true for documentation-only runs." >&2
          exit 1

      - name: Guard tenant write scope
        env:
          TENANT_PATH: ${{ inputs.tenant_path }}
          ALLOWED_WRITE_GLOBS: ${{ inputs.allowed_write_globs }}
          SCOPE_POLICY_MODE: ${{ inputs.scope_policy_mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import fnmatch
          import os
          import subprocess
          import sys

          mode = (os.environ.get("SCOPE_POLICY_MODE") or "").strip().lower()
          tenant_path = (os.environ.get("TENANT_PATH") or "").strip().replace("\\", "/")
          globs = [entry.strip() for entry in (os.environ.get("ALLOWED_WRITE_GLOBS") or "").split(",") if entry.strip()]
          changed = subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines()
          changed = [entry.strip().replace("\\", "/") for entry in changed if entry.strip()]
          if not changed:
            sys.exit(0)

          if not tenant_path and not globs:
            if mode == "enforce":
              print("Scope enforcement enabled but no tenant_path/allowed_write_globs supplied.", file=sys.stderr)
              sys.exit(1)
            print("No tenant write scope supplied; skipping scope guard.")
            sys.exit(0)

          def allowed(path: str) -> bool:
            if tenant_path and path.startswith(tenant_path):
              return True
            return any(fnmatch.fnmatch(path, pattern) for pattern in globs)

          violations = [path for path in changed if not allowed(path)]
          if not violations:
            print("Tenant write scope validation passed.")
            sys.exit(0)

          if mode == "enforce":
            print("Tenant write scope validation failed. Out-of-scope files:", file=sys.stderr)
            for path in violations:
              print(f"- {path}", file=sys.stderr)
            sys.exit(1)

          print("Tenant write scope warnings:")
          for path in violations:
            print(f"- {path}")
          PY

      - name: Prepare PR body
        env:
          CODEX_SUMMARY: ${{ steps.run_codex.outputs.final-message }}
          CONFLICTS: ${{ steps.sync_base.outputs.conflicts }}
          E2E_STATUS: ${{ steps.e2e_final.outputs.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          # Create pr-body.md in workspace root (same directory as this workflow file)
          # The peter-evans/create-pull-request action will find it via body-file: pr-body.md
          {
            echo "This PR was created automatically by Verity/Codex."
            echo ""
            echo "- Workflow run: ${RUN_URL}"
            echo "- Issue: ${ISSUE_NUMBER}"
          } > pr-body.md
          if [ "${CONFLICTS}" = "true" ]; then
            {
              echo ""
              echo "> ⚠️ **Conflict warning**: This PR was rebased onto a newer base commit. Codex attempted to resolve merge conflicts automatically — please review the diff carefully."
            } >> pr-body.md
          fi
          if [ "${E2E_STATUS}" = "failed" ]; then
            {
              echo ""
              echo "> ⚠️ **Browser tests failed**: Playwright e2e tests did not pass after 3 Codex fix attempts. Please review the e2e failures in the workflow artifacts."
            } >> pr-body.md
          elif [ "${E2E_STATUS}" = "passed" ]; then
            {
              echo ""
              echo "> ✅ **Browser tests passed**: Playwright e2e tests passed successfully."
            } >> pr-body.md
          elif [ "${E2E_STATUS}" = "skipped" ]; then
            {
              echo ""
              echo "> ℹ️ **Browser tests skipped**: Local servers could not start or Playwright was not available."
            } >> pr-body.md
          fi
          {
            echo ""
            echo "## Codex summary"
            echo ""
            printf '%s\n' "${CODEX_SUMMARY}"
          } >> pr-body.md

      - name: Create PR with changes
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.gh_write_token.outputs.token || secrets.VERITY_GITHUB_WRITE_TOKEN || github.token }}
          commit-message: "chore(verity): codex dev-cycle changes"
          branch: verity/codex-dev-cycle-${{ github.run_id }}
          delete-branch: true
          title: ${{ inputs.pr_title != '' && inputs.pr_title || format('Verity Codex dev-cycle (run {0})', github.run_id) }}
          body-file: pr-body.md  # File created in workspace root by "Prepare PR body" step
          labels: ${{ steps.e2e_final.outputs.status == 'failed' && format('{0},verity:e2e-failed', inputs.pr_labels) || inputs.pr_labels }}
          draft: ${{ inputs.pr_draft == 'true' }}

      - name: Comment on issue with PR link
        if: ${{ inputs.issue_number != '' && inputs.issue_number != '0' && steps.cpr.outputs.pull-request-number != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.gh_write_token.outputs.token || secrets.VERITY_GITHUB_WRITE_TOKEN || github.token }}
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `Opened PR #${process.env.PR_NUMBER}: ${process.env.PR_URL}\n\n(Generated by Verity/Codex dev cycle.)`,
            });
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}

      - name: Enable auto-merge on PR
        if: ${{ inputs.auto_merge == 'true' && steps.cpr.outputs.pull-request-number != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.gh_write_token.outputs.token || secrets.VERITY_GITHUB_WRITE_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # Enable auto-merge so the PR merges automatically once all required checks pass.
          # Falls back to merge commit if squash is not allowed on this repo.
          gh pr merge --auto --squash "$PR_NUMBER" 2>/dev/null || \
          gh pr merge --auto --merge "$PR_NUMBER" 2>/dev/null || \
          echo "auto-merge not available on this repository (branch protection rules may need to allow it)"

      - name: Notify Verity - completed
        if: always()
        continue-on-error: true
        env:
          VERITY_PROJECT_TOKEN: ${{ secrets.VERITY_PROJECT_TOKEN }}
          VERITY_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          VERITY_CALLBACK_URL: ${{ steps.cfg.outputs.callback_url }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
          BRANCH_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          E2E_SPECS_COUNT: ${{ steps.e2e_specs.outputs.count || '0' }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python - <<'PY' > /tmp/verity-callback.json
          import json, os, pathlib
          payload = {
            "event": "workflow_completed",
            "project_id": os.environ.get("VERITY_PROJECT_ID"),
            "repo": os.environ.get("GITHUB_REPOSITORY"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
            "status": os.environ.get("JOB_STATUS"),
            "pr_number": os.environ.get("PR_NUMBER") or None,
            "pr_url": os.environ.get("PR_URL") or None,
            "codex_final_message": (os.environ.get("CODEX_FINAL_MESSAGE") or "")[:20000],
            "branch": os.environ.get("BRANCH_NAME") or None,
            "sha": os.environ.get("HEAD_SHA") or None,
            "issue_number": os.environ.get("ISSUE_NUMBER") or None,
            "run_correlation_id": f"{os.environ.get('GITHUB_WORKFLOW')}:{os.environ.get('GITHUB_RUN_ID')}:{os.environ.get('GITHUB_RUN_ATTEMPT')}"
          }
          # Include passing E2E spec files for automatic test case capture
          specs_count = int(os.environ.get("E2E_SPECS_COUNT") or "0")
          specs_path = pathlib.Path("/tmp/e2e-spec-files.json")
          if specs_count > 0 and specs_path.exists():
            try:
              specs = json.loads(specs_path.read_text(encoding="utf-8"))
              if specs:
                payload["e2e_spec_files"] = specs
            except Exception:
              pass
          print(json.dumps(payload))
          PY
          curl -sS -X POST "$VERITY_CALLBACK_URL" \
            -H "Authorization: Bearer $VERITY_PROJECT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verity-callback.json || true
